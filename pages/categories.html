<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Categories &amp; Payment Methods</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- Container where navbar.js injects the shared navigation bar -->
    <div id="navbar-container"></div>

    <div class="container my-4">
        <!-- Page Title & Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-1" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Categories &amp; Payment Methods</h2>
                <p class="text-secondary small mb-0">
                    Manage categories and payment methods for tracking your income and expenses.
                </p>
            </div>
        </div>

        <!-- Global Alert Message -->
        <div id="globalAlert" class="alert d-none" role="alert"></div>

        <div class="row g-4">
            <!-- SECTION 1: CATEGORIES -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="card-title fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                            <i class="bi bi-tags text-primary"></i>
                            <span>Categories</span>
                        </h5>
                        <span id="catBadgeCount" class="badge bg-primary">0 Active</span>
                    </div>
                    <div class="card-body">
                        <!-- Add Category Form -->
                        <form id="addCategoryForm" class="mb-4">
                            <label for="newCategoryName" class="form-label small fw-semibold text-muted">
                                Create New Category
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="newCategoryName" placeholder="e.g., Subscriptions, Pet Care, Fitness" required maxlength="100">
                                <button type="submit" class="btn btn-primary d-flex align-items-center gap-1" id="addCategoryBtn">
                                    <i class="bi bi-plus-lg"></i> Add
                                </button>
                            </div>
                        </form>

                        <!-- Categories Table -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Category Name</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted py-4">Loading categories...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: PAYMENT METHODS -->
            <div class="col-12 col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center">
                        <h5 class="card-title fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                            <i class="bi bi-credit-card-2-front text-success"></i>
                            <span>Payment Methods</span>
                        </h5>
                        <span id="pmBadgeCount" class="badge bg-success">0 Active</span>
                    </div>
                    <div class="card-body">
                        <!-- Add Payment Method Form -->
                        <form id="addPaymentMethodForm" class="mb-4">
                            <label for="newPaymentMethodName" class="form-label small fw-semibold text-muted">
                                Create New Payment Method
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="newPaymentMethodName" placeholder="e.g., Paytm, Crypto, Forex Card" required maxlength="100">
                                <button type="submit" class="btn btn-success d-flex align-items-center gap-1" id="addPaymentMethodBtn">
                                    <i class="bi bi-plus-lg"></i> Add
                                </button>
                            </div>
                        </form>

                        <!-- Payment Methods Table -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Method Name</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="paymentMethodsTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center text-muted py-4">Loading payment methods...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Category Modal -->
    <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editCategoryModalLabel">Edit Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="editCatAlert" class="alert d-none" role="alert"></div>
                    <form id="editCategoryForm">
                        <input type="hidden" id="editCategoryId">
                        <div class="mb-3">
                            <label for="editCategoryName" class="form-label">Category Name</label>
                            <input type="text" class="form-control" id="editCategoryName" required maxlength="100">
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="saveEditCatBtn">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Payment Method Modal -->
    <div class="modal fade" id="editPaymentMethodModal" tabindex="-1" aria-labelledby="editPaymentMethodModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="editPaymentMethodModalLabel">Edit Payment Method</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="editPmAlert" class="alert d-none" role="alert"></div>
                    <form id="editPaymentMethodForm">
                        <input type="hidden" id="editPaymentMethodId">
                        <div class="mb-3">
                            <label for="editPaymentMethodName" class="form-label">Payment Method Name</label>
                            <input type="text" class="form-control" id="editPaymentMethodName" required maxlength="100">
                        </div>
                        <div class="text-end">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success" id="saveEditPmBtn">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared Navbar & Session Guard Script -->
    <script src="../assets/js/navbar.js"></script>

    <script>
        // Bootstrap Modal instances
        let catModalInstance = null;
        let pmModalInstance = null;

        document.addEventListener("DOMContentLoaded", function () {
            catModalInstance = new bootstrap.Modal(document.getElementById("editCategoryModal"));
            pmModalInstance = new bootstrap.Modal(document.getElementById("editPaymentMethodModal"));

            // Initial fetch of both datasets
            loadCategories();
            loadPaymentMethods();

            // Form Submit Listeners
            document.getElementById("addCategoryForm").addEventListener("submit", handleAddCategory);
            document.getElementById("addPaymentMethodForm").addEventListener("submit", handleAddPaymentMethod);
            document.getElementById("editCategoryForm").addEventListener("submit", handleSaveEditCategory);
            document.getElementById("editPaymentMethodForm").addEventListener("submit", handleSaveEditPaymentMethod);
        });

        // ----------------------------------------------------
        // CATEGORIES LOGIC
        // ----------------------------------------------------

        // Category & Payment Method Icon Helpers
        function getCategoryIcon(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('food') || n.includes('dining') || n.includes('restaurant') || n.includes('meal') || n.includes('snack')) return 'bi-egg-fried text-warning';
            if (n.includes('rent') || n.includes('housing') || n.includes('home') || n.includes('room')) return 'bi-house-door-fill text-primary';
            if (n.includes('transport') || n.includes('fuel') || n.includes('car') || n.includes('travel') || n.includes('taxi') || n.includes('bus')) return 'bi-car-front-fill text-info';
            if (n.includes('shopping') || n.includes('personal') || n.includes('cloth') || n.includes('grocer')) return 'bi-bag-heart-fill text-danger';
            if (n.includes('utilit') || n.includes('bill') || n.includes('electric') || n.includes('water') || n.includes('wifi') || n.includes('gas')) return 'bi-lightning-charge-fill text-warning';
            if (n.includes('health') || n.includes('medic') || n.includes('doctor') || n.includes('pharmacy')) return 'bi-heart-pulse-fill text-danger';
            if (n.includes('entertain') || n.includes('movie') || n.includes('game') || n.includes('fun') || n.includes('subscript')) return 'bi-controller text-primary';
            if (n.includes('education') || n.includes('book') || n.includes('course') || n.includes('study') || n.includes('tuition')) return 'bi-book-half text-success';
            if (n.includes('salary') || n.includes('income') || n.includes('bonus') || n.includes('wage')) return 'bi-cash-coin text-success';
            if (n.includes('invest') || n.includes('stock') || n.includes('crypto')) return 'bi-graph-up-arrow text-success';
            return 'bi-tag-fill text-primary';
        }

        function getPaymentMethodIcon(name) {
            const n = (name || '').toLowerCase();
            if (n.includes('cash')) return 'bi-cash-stack text-success';
            if (n.includes('credit')) return 'bi-credit-card-2-front-fill text-primary';
            if (n.includes('debit')) return 'bi-credit-card text-info';
            if (n.includes('upi') || n.includes('wallet') || n.includes('paytm') || n.includes('gpay') || n.includes('phonepe') || n.includes('digital')) return 'bi-phone-vibrate-fill text-warning';
            if (n.includes('net banking') || n.includes('bank') || n.includes('transfer')) return 'bi-bank2 text-dark';
            if (n.includes('crypto')) return 'bi-currency-bitcoin text-warning';
            return 'bi-wallet2 text-success';
        }

        // Fetch and display categories
        function loadCategories() {
            fetch("../api/get_categories.php")
                .then(res => res.json())
                .then(response => {
                    const tbody = document.getElementById("categoriesTableBody");
                    if (response.status !== "success") {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-danger text-center">${escapeHtml(response.message)}</td></tr>`;
                        return;
                    }

                    const categories = response.data;
                    document.getElementById("catBadgeCount").innerText = `${categories.length} Active`;

                    if (categories.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-muted text-center py-4">No categories found.</td></tr>`;
                        return;
                    }

                    let rowsHtml = "";
                    categories.forEach(item => {
                        const iconClass = getCategoryIcon(item.name);
                        const safeName = escapeHtml(item.name).replace(/'/g, "\\'");
                        rowsHtml += `
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center bg-light border shadow-sm" style="width: 38px; height: 38px; font-size: 1.15rem;">
                                            <i class="bi ${iconClass}"></i>
                                        </div>
                                        <span class="fw-semibold text-dark">${escapeHtml(item.name)}</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                        <i class="bi bi-check-circle-fill me-1"></i>Active
                                    </span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-primary me-1" title="Edit Category" onclick="openEditCategory(${item.id}, '${safeName}')">
                                        <i class="bi bi-pencil-square me-1"></i>Edit
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" title="Delete Category" onclick="deleteCategory(${item.id}, '${safeName}')">
                                        <i class="bi bi-trash3 me-1"></i>Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = rowsHtml;
                })
                .catch(err => {
                    console.error("Categories fetch error:", err);
                    showGlobalAlert("Failed to load categories. Please check your network connection.", "danger");
                });
        }

        // Add Category
        function handleAddCategory(e) {
            if (e) e.preventDefault();
            const input = document.getElementById("newCategoryName");
            const btn = document.getElementById("addCategoryBtn");
            const name = input.value.trim();

            if (!name) return;

            btn.disabled = true;
            btn.innerText = "Adding...";

            fetch("../api/add_category.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-lg"></i> Add';
                if (data.status === "success") {
                    showGlobalAlert(data.data.message, "success");
                    input.value = "";
                    loadCategories();
                } else {
                    showGlobalAlert(data.message, "danger");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-lg"></i> Add';
                showGlobalAlert("An error occurred while adding the category.", "danger");
            });
        }

        // Open Edit Category Modal
        function openEditCategory(id, name) {
            document.getElementById("editCategoryId").value = id;
            document.getElementById("editCategoryName").value = name;
            hideAlert("editCatAlert");
            catModalInstance.show();
        }

        // Save Edited Category
        function handleSaveEditCategory(e) {
            e.preventDefault();
            const id = document.getElementById("editCategoryId").value;
            const name = document.getElementById("editCategoryName").value.trim();
            const btn = document.getElementById("saveEditCatBtn");

            if (!name) return;

            btn.disabled = true;
            btn.innerText = "Saving...";

            fetch("../api/update_category.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, name: name })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = "Save Changes";
                if (data.status === "success") {
                    catModalInstance.hide();
                    showGlobalAlert(data.data.message, "success");
                    loadCategories();
                } else {
                    showAlert("editCatAlert", data.message, "danger");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerText = "Save Changes";
                showAlert("editCatAlert", "Failed to update category.", "danger");
            });
        }

        // Delete Category
        function deleteCategory(id, name) {
            if (!confirm(`Are you sure you want to delete category "${name}"?`)) {
                return;
            }

            fetch("../api/delete_category.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    showGlobalAlert(data.data.message, "success");
                    loadCategories();
                } else {
                    // Show friendly error message (e.g. if linked to expenses)
                    showGlobalAlert(data.message, "warning");
                }
            })
            .catch(() => {
                showGlobalAlert("Failed to delete category due to network error.", "danger");
            });
        }

        // ----------------------------------------------------
        // PAYMENT METHODS LOGIC
        // ----------------------------------------------------

        // Fetch and display payment methods
        function loadPaymentMethods() {
            fetch("../api/get_payment_methods.php")
                .then(res => res.json())
                .then(response => {
                    const tbody = document.getElementById("paymentMethodsTableBody");
                    if (response.status !== "success") {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-danger text-center">${escapeHtml(response.message)}</td></tr>`;
                        return;
                    }

                    const methods = response.data;
                    document.getElementById("pmBadgeCount").innerText = `${methods.length} Active`;

                    if (methods.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="3" class="text-muted text-center py-4">No payment methods found.</td></tr>`;
                        return;
                    }

                    let rowsHtml = "";
                    methods.forEach(item => {
                        const pmIconClass = getPaymentMethodIcon(item.name);
                        const safeName = escapeHtml(item.name).replace(/'/g, "\\'");
                        rowsHtml += `
                            <tr>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center bg-light border shadow-sm" style="width: 38px; height: 38px; font-size: 1.15rem;">
                                            <i class="bi ${pmIconClass}"></i>
                                        </div>
                                        <span class="fw-semibold text-dark">${escapeHtml(item.name)}</span>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1">
                                        <i class="bi bi-check-circle-fill me-1"></i>Active
                                    </span>
                                </td>
                                <td class="text-end">
                                    <button class="btn btn-sm btn-outline-success me-1" title="Edit Payment Method" onclick="openEditPaymentMethod(${item.id}, '${safeName}')">
                                        <i class="bi bi-pencil-square me-1"></i>Edit
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" title="Delete Payment Method" onclick="deletePaymentMethod(${item.id}, '${safeName}')">
                                        <i class="bi bi-trash3 me-1"></i>Delete
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = rowsHtml;
                })
                .catch(err => {
                    console.error("Payment methods fetch error:", err);
                    showGlobalAlert("Failed to load payment methods.", "danger");
                });
        }

        // Add Payment Method
        function handleAddPaymentMethod(e) {
            if (e) e.preventDefault();
            const input = document.getElementById("newPaymentMethodName");
            const btn = document.getElementById("addPaymentMethodBtn");
            const name = input.value.trim();

            if (!name) return;

            btn.disabled = true;
            btn.innerText = "Adding...";

            fetch("../api/add_payment_method.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-lg"></i> Add';
                if (data.status === "success") {
                    showGlobalAlert(data.data.message, "success");
                    input.value = "";
                    loadPaymentMethods();
                } else {
                    showGlobalAlert(data.message, "danger");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-plus-lg"></i> Add';
                showGlobalAlert("An error occurred while adding the payment method.", "danger");
            });
        }

        // Open Edit Payment Method Modal
        function openEditPaymentMethod(id, name) {
            document.getElementById("editPaymentMethodId").value = id;
            document.getElementById("editPaymentMethodName").value = name;
            hideAlert("editPmAlert");
            pmModalInstance.show();
        }

        // Save Edited Payment Method
        function handleSaveEditPaymentMethod(e) {
            e.preventDefault();
            const id = document.getElementById("editPaymentMethodId").value;
            const name = document.getElementById("editPaymentMethodName").value.trim();
            const btn = document.getElementById("saveEditPmBtn");

            if (!name) return;

            btn.disabled = true;
            btn.innerText = "Saving...";

            fetch("../api/update_payment_method.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id, name: name })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = "Save Changes";
                if (data.status === "success") {
                    pmModalInstance.hide();
                    showGlobalAlert(data.data.message, "success");
                    loadPaymentMethods();
                } else {
                    showAlert("editPmAlert", data.message, "danger");
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerText = "Save Changes";
                showAlert("editPmAlert", "Failed to update payment method.", "danger");
            });
        }

        // Delete Payment Method
        function deletePaymentMethod(id, name) {
            if (!confirm(`Are you sure you want to delete payment method "${name}"?`)) {
                return;
            }

            fetch("../api/delete_payment_method.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    showGlobalAlert(data.data.message, "success");
                    loadPaymentMethods();
                } else {
                    // Show friendly error message (e.g. if linked to expenses)
                    showGlobalAlert(data.message, "warning");
                }
            })
            .catch(() => {
                showGlobalAlert("Failed to delete payment method due to network error.", "danger");
            });
        }

        // ----------------------------------------------------
        // UTILITIES
        // ----------------------------------------------------
        function showGlobalAlert(message, type) {
            const alertBox = document.getElementById("globalAlert");
            alertBox.className = `alert alert-${type} alert-dismissible fade show`;
            alertBox.innerHTML = `
                ${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            alertBox.classList.remove("d-none");
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function showAlert(containerId, message, type) {
            const box = document.getElementById(containerId);
            box.className = `alert alert-${type}`;
            box.innerText = message;
            box.classList.remove("d-none");
        }

        function hideAlert(containerId) {
            const box = document.getElementById(containerId);
            box.classList.add("d-none");
        }

        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement("div");
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
