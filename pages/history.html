<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Expense History</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <!-- Container where navbar.js injects the shared navigation bar -->
    <div id="navbar-container"></div>

    <div class="container my-4">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-1" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Expense History</h2>
                <p class="text-secondary small mb-0">Search, filter, sort, and export your transaction records.</p>
            </div>
            <div class="d-flex gap-2">
                <button id="exportCsvBtn" class="btn btn-success btn-sm px-3 shadow-sm d-flex align-items-center gap-1">
                    <i class="bi bi-file-earmark-spreadsheet fs-6"></i>
                    <span>Export CSV</span>
                </button>
                <button id="exportPdfBtn" class="btn btn-danger btn-sm px-3 shadow-sm d-flex align-items-center gap-1">
                    <i class="bi bi-file-earmark-pdf fs-6"></i>
                    <span>Export PDF</span>
                </button>
            </div>
        </div>

        <!-- Global Alert Message -->
        <div id="globalAlert" class="alert d-none" role="alert"></div>

        <!-- Filter Panel Card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <form id="filterForm">
                    <div class="row g-3">
                        <!-- Search Keyword -->
                        <div class="col-12 col-md-4">
                            <label for="filterSearch" class="form-label small fw-semibold">Search Description</label>
                            <input type="text" class="form-control form-control-sm" id="filterSearch" placeholder="e.g. Coffee, Uber, Amazon">
                        </div>

                        <!-- Category Filter -->
                        <div class="col-6 col-md-4">
                            <label for="filterCategory" class="form-label small fw-semibold">Category</label>
                            <select class="form-select form-select-sm" id="filterCategory">
                                <option value="0">All Categories</option>
                            </select>
                        </div>

                        <!-- Payment Method Filter -->
                        <div class="col-6 col-md-4">
                            <label for="filterPaymentMethod" class="form-label small fw-semibold">Payment Method</label>
                            <select class="form-select form-select-sm" id="filterPaymentMethod">
                                <option value="0">All Payment Methods</option>
                            </select>
                        </div>

                        <!-- From Date -->
                        <div class="col-6 col-md-3">
                            <label for="filterFromDate" class="form-label small fw-semibold">From Date</label>
                            <input type="date" class="form-control form-control-sm" id="filterFromDate">
                        </div>

                        <!-- To Date -->
                        <div class="col-6 col-md-3">
                            <label for="filterToDate" class="form-label small fw-semibold">To Date</label>
                            <input type="date" class="form-control form-control-sm" id="filterToDate">
                        </div>

                        <!-- Min Amount -->
                        <div class="col-6 col-md-3">
                            <label for="filterMinAmount" class="form-label small fw-semibold">Min Amount (₹)</label>
                            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="filterMinAmount" placeholder="0.00">
                        </div>

                        <!-- Max Amount -->
                        <div class="col-6 col-md-3">
                            <label for="filterMaxAmount" class="form-label small fw-semibold">Max Amount (₹)</label>
                            <input type="number" step="0.01" min="0" class="form-control form-control-sm" id="filterMaxAmount" placeholder="No limit">
                        </div>

                        <!-- Sort By & Order -->
                        <div class="col-6 col-md-3">
                            <label for="filterSortBy" class="form-label small fw-semibold">Sort By</label>
                            <select class="form-select form-select-sm" id="filterSortBy">
                                <option value="date" selected>Date</option>
                                <option value="amount">Amount</option>
                            </select>
                        </div>

                        <div class="col-6 col-md-3">
                            <label for="filterSortOrder" class="form-label small fw-semibold">Order</label>
                            <select class="form-select form-select-sm" id="filterSortOrder">
                                <option value="desc" selected>Descending (Newest / Highest)</option>
                                <option value="asc">Ascending (Oldest / Lowest)</option>
                            </select>
                        </div>

                        <!-- Per Page -->
                        <div class="col-6 col-md-2">
                            <label for="filterLimit" class="form-label small fw-semibold">Rows per page</label>
                            <select class="form-select form-select-sm" id="filterLimit">
                                <option value="10" selected>10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                            </select>
                        </div>

                        <!-- Action Buttons -->
                        <div class="col-6 col-md-4 d-flex align-items-end gap-2">
                            <button type="submit" class="btn btn-primary btn-sm px-3 flex-grow-1 d-flex align-items-center justify-content-center gap-1 shadow-sm">
                                <i class="bi bi-funnel"></i>
                                <span>Apply Filters</span>
                            </button>
                            <button type="button" id="resetFiltersBtn" class="btn btn-outline-secondary btn-sm px-3 d-flex align-items-center gap-1">
                                <i class="bi bi-arrow-counterclockwise"></i>
                                <span>Reset</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- History Records Table Card -->
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="d-flex align-items-center gap-2">
                    <h5 class="card-title fw-bold mb-0 text-dark d-flex align-items-center gap-2">
                        <i class="bi bi-receipt text-primary"></i>
                        <span>Filtered Transactions</span>
                    </h5>
                    <span id="filteredCountBadge" class="badge bg-secondary">0 Records</span>
                </div>
                <div class="fw-bold text-dark">
                    Total: <span id="filteredSumDisplay" class="text-primary">₹0.00</span>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Payment Method</th>
                                <th>Description</th>
                                <th class="text-end">Amount</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Loading history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- Pagination Footer -->
            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3 flex-wrap gap-2">
                <span class="small text-muted" id="pageInfoText">Page 1 of 1</span>
                <nav aria-label="Page navigation">
                    <ul class="pagination pagination-sm mb-0" id="paginationControls">
                        <!-- Dynamic pagination buttons -->
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Shared Navbar & Session Guard Script -->
    <script src="../assets/js/navbar.js"></script>

    <script>
        let currentPage = 1;

        document.addEventListener("DOMContentLoaded", function () {
            loadFilterDropdowns();
            loadHistory();

            // Submit listener for filters
            document.getElementById("filterForm").addEventListener("submit", function (e) {
                e.preventDefault();
                currentPage = 1;
                loadHistory();
            });

            // Reset filters
            document.getElementById("resetFiltersBtn").addEventListener("click", function () {
                document.getElementById("filterForm").reset();
                currentPage = 1;
                loadHistory();
            });

            // Export CSV & PDF button clicks
            document.getElementById("exportCsvBtn").addEventListener("click", handleExportCsv);
            document.getElementById("exportPdfBtn").addEventListener("click", handleExportPdf);
        });

        // Load Categories & Payment Methods into filter dropdowns
        function loadFilterDropdowns() {
            fetch("../api/get_categories.php")
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        const select = document.getElementById("filterCategory");
                        let html = `<option value="0">All Categories</option>`;
                        res.data.forEach(c => {
                            html += `<option value="${c.id}">${escapeHtml(c.name)}</option>`;
                        });
                        select.innerHTML = html;
                    }
                });

            fetch("../api/get_payment_methods.php")
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        const select = document.getElementById("filterPaymentMethod");
                        let html = `<option value="0">All Payment Methods</option>`;
                        res.data.forEach(p => {
                            html += `<option value="${p.id}">${escapeHtml(p.name)}</option>`;
                        });
                        select.innerHTML = html;
                    }
                });
        }

        // Build URL query string from filter inputs
        function buildQueryParams(includePagination = true) {
            const params = new URLSearchParams();

            const search = document.getElementById("filterSearch").value.trim();
            const cat = document.getElementById("filterCategory").value;
            const pm = document.getElementById("filterPaymentMethod").value;
            const fromDate = document.getElementById("filterFromDate").value;
            const toDate = document.getElementById("filterToDate").value;
            const minAmount = document.getElementById("filterMinAmount").value;
            const maxAmount = document.getElementById("filterMaxAmount").value;
            const sortBy = document.getElementById("filterSortBy").value;
            const sortOrder = document.getElementById("filterSortOrder").value;
            const limit = document.getElementById("filterLimit").value;

            if (search) params.append("search", search);
            if (cat > 0) params.append("category_id", cat);
            if (pm > 0) params.append("payment_method_id", pm);
            if (fromDate) params.append("from_date", fromDate);
            if (toDate) params.append("to_date", toDate);
            if (minAmount) params.append("min_amount", minAmount);
            if (maxAmount) params.append("max_amount", maxAmount);
            params.append("sort_by", sortBy);
            params.append("sort_order", sortOrder);

            if (includePagination) {
                params.append("page", currentPage);
                params.append("limit", limit);
            }

            return params.toString();
        }

        // Fetch paginated history from api/get_history.php
        function loadHistory() {
            const query = buildQueryParams(true);
            fetch(`../api/get_history.php?${query}`)
                .then(res => res.json())
                .then(response => {
                    const tbody = document.getElementById("historyTableBody");
                    if (response.status !== "success") {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-danger text-center py-4">${escapeHtml(response.message)}</td></tr>`;
                        return;
                    }

                    const data = response.data;
                    const expenses = data.expenses;
                    const pag = data.pagination;

                    // Update summary badges
                    document.getElementById("filteredCountBadge").innerText = `${pag.total_records} Records`;
                    document.getElementById("filteredSumDisplay").innerText = `₹${data.summary.total_amount.toFixed(2)}`;
                    document.getElementById("pageInfoText").innerText = `Page ${pag.current_page} of ${pag.total_pages} (${pag.total_records} total)`;

                    // Render rows
                    if (expenses.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="5" class="text-muted text-center py-5">No matching expenses found. Try adjusting your filters.</td></tr>`;
                        renderPagination(1, 1);
                        return;
                    }

                    let rows = "";
                    expenses.forEach(item => {
                        const dateFormatted = new Date(item.expense_date).toLocaleDateString('en-IN', {
                            day: '2-digit', month: 'short', year: 'numeric'
                        });

                        rows += `
                            <tr>
                                <td class="small fw-semibold text-secondary">${dateFormatted}</td>
                                <td><span class="badge bg-light text-dark border">${escapeHtml(item.category_name)}</span></td>
                                <td class="small text-muted">${escapeHtml(item.payment_method_name)}</td>
                                <td class="small">${escapeHtml(item.description || "-")}</td>
                                <td class="text-end fw-bold text-danger">₹${item.amount.toFixed(2)}</td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = rows;

                    // Render pagination buttons
                    renderPagination(pag.current_page, pag.total_pages);
                })
                .catch(err => {
                    console.error("History error:", err);
                    showGlobalAlert("Failed to load expense history.", "danger");
                });
        }

        // Render pagination controls
        function renderPagination(current, total) {
            const container = document.getElementById("paginationControls");
            let html = "";

            // Previous Button
            html += `
                <li class="page-item ${current <= 1 ? 'disabled' : ''}">
                    <button class="page-link" onclick="goToPage(${current - 1})" aria-label="Previous">&laquo;</button>
                </li>
            `;

            // Page numbers
            for (let i = 1; i <= total; i++) {
                if (i === 1 || i === total || (i >= current - 2 && i <= current + 2)) {
                    html += `
                        <li class="page-item ${i === current ? 'active' : ''}">
                            <button class="page-link" onclick="goToPage(${i})">${i}</button>
                        </li>
                    `;
                } else if (i === current - 3 || i === current + 3) {
                    html += `<li class="page-item disabled"><span class="page-link">...</span></li>`;
                }
            }

            // Next Button
            html += `
                <li class="page-item ${current >= total ? 'disabled' : ''}">
                    <button class="page-link" onclick="goToPage(${current + 1})" aria-label="Next">&raquo;</button>
                </li>
            `;

            container.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            loadHistory();
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // Trigger CSV export
        function handleExportCsv() {
            // Build query without pagination so all matching records are exported
            const query = buildQueryParams(false);
            window.location.href = `../api/export_csv.php?${query}`;
        }

        // Trigger PDF export
        function handleExportPdf() {
            // Build query without pagination so all matching records are exported
            const query = buildQueryParams(false);
            window.location.href = `../api/export_pdf.php?${query}`;
        }

        function showGlobalAlert(message, type) {
            const alertBox = document.getElementById("globalAlert");
            alertBox.className = `alert alert-${type} alert-dismissible fade show`;
            alertBox.innerHTML = `
                ${escapeHtml(message)}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            alertBox.classList.remove("d-none");
        }

        function escapeHtml(text) {
            if (!text) return "";
            const div = document.createElement("div");
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
