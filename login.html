<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                    <div class="card auth-card shadow-lg">
                        <div class="auth-header">
                            <div class="mb-3">
                                <span class="auth-brand-badge">
                                    <i class="bi bi-gem"></i>
                                </span>
                            </div>
                            <h3 class="fw-bold mb-1">Welcome to SpendWise</h3>
                            <p class="mb-0 small text-white-50">Smart Expense Tracking &amp; Budget Management</p>
                        </div>
                        <div class="auth-body">
                            <!-- Alert message container -->
                            <div id="alertBox" class="alert d-none" role="alert"></div>

                            <!-- Login Form -->
                            <form id="loginForm">
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <div class="auth-input-box">
                                        <i class="bi bi-envelope auth-input-icon"></i>
                                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="username">
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <div class="auth-input-box">
                                        <i class="bi bi-lock auth-input-icon"></i>
                                        <input type="password" class="form-control" id="password" placeholder="Enter your password" required autocomplete="current-password">
                                    </div>
                                </div>

                                <button type="submit" id="submitBtn" class="btn btn-primary w-100 py-2 fs-6 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-2">
                                    <span>Sign In to Dashboard</span>
                                    <i class="bi bi-arrow-right"></i>
                                </button>
                            </form>

                            <div class="text-center mt-4">
                                <span class="text-muted small">Don't have an account?</span>
                                <a href="register.html" class="small fw-bold text-decoration-none text-primary ms-1">Sign up here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/navbar.js"></script>

    <script>
        // Login form submission handler
        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const alertBox = document.getElementById("alertBox");
            const submitBtn = document.getElementById("submitBtn");

            // Client-side validation
            if (!email || !password) {
                showAlert("Please enter both email and password.", "danger");
                return;
            }

            // Disable button during network request
            submitBtn.disabled = true;
            submitBtn.innerText = "Logging in...";

            // Send login request via fetch()
            fetch("api/login.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            })
            .then(res => res.json())
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Log In";

                if (data.status === "success") {
                    showAlert("Login successful! Redirecting...", "success");
                    // Redirect to dashboard page
                    setTimeout(() => {
                        window.location.href = "pages/dashboard.html";
                    }, 1000);
                } else {
                    showAlert(data.message, "danger");
                }
            })
            .catch(err => {
                console.error("Error:", err);
                submitBtn.disabled = false;
                submitBtn.innerText = "Log In";
                showAlert("A network error occurred. Please try again.", "danger");
            });
        });

        // Helper to display alert messages
        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.className = `alert alert-${type}`;
            alertBox.innerText = message;
            alertBox.classList.remove("d-none");
        }
    </script>
</body>
</html>
