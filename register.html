<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <div class="container auth-wrapper">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card auth-card">
                <div class="auth-header">
                    <h3>Create Account</h3>
                    <p class="mb-0 small text-white-50">Join SpendWise and take control of your finances</p>
                </div>
                <div class="auth-body">
                    <!-- Alert message container -->
                    <div id="alertBox" class="alert d-none" role="alert"></div>

                    <!-- Registration Form -->
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" required>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100">
                            Sign Up
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="login.html" class="small fw-bold text-decoration-none text-primary ms-1">Log in here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/navbar.js"></script>

    <script>
        // Form submission handler
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const alertBox = document.getElementById("alertBox");
            const submitBtn = document.getElementById("submitBtn");

            // Client-side validation
            if (!name || !email || !password) {
                showAlert("Please fill in all fields.", "danger");
                return;
            }

            if (password.length < 6) {
                showAlert("Password must be at least 6 characters long.", "danger");
                return;
            }

            // Disable button during network request
            submitBtn.disabled = true;
            submitBtn.innerText = "Registering...";

            // Send registration request via fetch()
            fetch("api/register.php", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
            .then(res => res.json())
            .then(data => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign Up";

                if (data.status === "success") {
                    showAlert(data.data.message, "success");
                    document.getElementById("registerForm").reset();
                    // Redirect to login after 1.5 seconds
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 1500);
                } else {
                    showAlert(data.message, "danger");
                }
            })
            .catch(err => {
                console.error("Error:", err);
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign Up";
                showAlert("A network error occurred. Please try again.", "danger");
            });
        });

        // Helper to display alert messages
        function showAlert(message, type) {
            const alertBox = document.getElementById("alertBox");
            alertBox.className = `alert alert-${type}`;
            alertBox.innerText = message;
            alertBox.classList.remove("d-none");
        }
    </script>
</body>
</html>
